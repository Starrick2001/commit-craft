project_name: commit-craft

builds:
  - id: commit-craft
    main: .
    binary: "commit-craft_{{ .Os }}_{{ .Arch }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - format: binary
    name_template: "{{ .Binary }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: "{{ .Env.REPOSITORY_OWNER }}"
    name: "{{ .Env.REPOSITORY_NAME }}"
