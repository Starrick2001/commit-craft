name: release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        id: tagcheck
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "Tag commit is not on main; skipping build/release."
          fi

      - name: Setup Go
        if: steps.tagcheck.outputs.on_main == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        if: steps.tagcheck.outputs.on_main == 'true'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/commit-craft .

      - name: Create GitHub release
        if: steps.tagcheck.outputs.on_main == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/commit-craft
